# that section describes only what a migration actually creates - a map that claims a table
# which does not exist is worse than no map, because it will be believed.
planned_tables:

  performance.performance_cycle:
    domain: performance
    tenant_scoped: true
    rls_required: true

  performance.goal:
    domain: performance
    tenant_scoped: true
    rls_required: true
    relationships: {cycle: performance.performance_cycle, employee: core.employee}

  performance.performance_review:
    domain: performance
    tenant_scoped: true
    rls_required: true
    relationships: {cycle: performance.performance_cycle, employee: core.employee}

  performance.feedback:
    domain: performance
    tenant_scoped: true
    rls_required: true
    relationships: {review: performance.performance_review}

deliberately_not_built:
  note: >-
    Present in the ERD but intentionally absent from the schema. Listed here so the next
    person does not "restore" them assuming an omission.
  core.manager_assignment: >-
    Superseded by core.employment_history, which already carries manager_employee_id as part
    of the same effective-dated record as department and designation. Two parallel manager
    timelines can disagree; one cannot.
  workforce.timesheet: >-
    Project/task time allocation is a different concept from attendance and needs project
    and task entities that do not exist. Out of MVP scope; will need its own design.

not_yet_modeled:
  note: named in PRD s.26 but absent from the ERD; design before implementing
  recruitment: [job_requisition, candidate, application, interview, offer]
  onboarding: [onboarding_plan, onboarding_task]
  benefits: [benefit_plan, benefit_enrollment]
  learning: [course, enrollment]
  core_hr: [emergency_contact]
